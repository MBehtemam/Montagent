[package]
name = "montagent"
description = "A video editor whose project format is authored by an AI agent: one binary, a CLI and an MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["video-editing", "video", "mcp", "ai-agent"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
montagent-core.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.4", features = ["server", "macros", "schemars", "transport-io"] }
schemars.workspace = true
tokio = { version = "1", features = ["rt", "macros", "io-std", "sync", "time"] }

[dev-dependencies]
serde_json.workspace = true
# The cold-process budget test times the built binary and judges it against the one place
# the numbers live (ADR-0021, #189), rather than restating 500 ms here.
montagent-render.workspace = true
