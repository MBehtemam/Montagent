[package]
name = "montagent-core"
description = "The Montagent core library: parsing, the finding type, the check registry and the report surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["video-editing", "validation", "video"]
categories = ["multimedia::video", "parsing"]
# #358 excluded five specific goldens by name — the ones compositing the fixture's
# photography and channel logo, rights-reserved rather than MIT (../../LICENSE-MEDIA.md) —
# and deliberately kept `text-features.png` in the tarball because it draws only text and
# has nothing to hide. #366 widens this to the whole directory, which **supersedes** that
# one line: none of `tests/` can run downstream regardless of rights, since ~140 files
# reach `../../fixtures/` outside the package (`cargo publish`'s verification only builds
# the package; it never runs its tests, which is why every prior dry-run was green anyway).
# A tarball that ships tests nobody downstream can run is incoherent whether or not any one
# of them happens to be rights-clean, so the golden PNGs go with the rest of the directory
# rather than being carved out file-by-file a second time. Nothing is lost: `cargo test
# --workspace` reads the source tree, not the tarball. A new golden drawing fixture media
# still belongs in LICENSE-MEDIA.md if it composites anything rights-reserved — this
# exclude means that decision no longer also has to be repeated here.
exclude = ["tests/**"]

[dependencies]
montagent-render.workspace = true
montagent-text.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true

[dev-dependencies]
# The independent oracle for `tests/measure.rs`. `measure`'s ascent and descent reach it
# through `parley`'s shaping; the test reads the same font's vertical metrics straight off
# the file through `skrifa`, so the expected value comes from somewhere other than the code
# under test rather than being recomputed the way that code computes it.
skrifa.workspace = true
# The independent decoder for `tests/frame.rs`. A claim about pixels is the one class of
# claim no report can reach, and an encoder agreeing with its own decoder proves they agree
# rather than that the bytes are a picture — so the test reads them back with something
# other than the Skia codec that wrote them.
image.workspace = true
