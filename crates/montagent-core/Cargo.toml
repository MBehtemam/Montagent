[package]
name = "montagent-core"
description = "The Montagent core library: parsing, the finding type, the check registry and the report surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Five of the six goldens composite the fixture's photography and channel logo, which are
# rights-reserved rather than MIT (see ../../LICENSE-MEDIA.md). `license = "MIT"` is a
# machine-readable claim over every byte in the tarball, so they must not be in it.
# Nothing is lost: the tests reading them also read `../../fixtures/`, outside the crate,
# so they already cannot run from a published tarball. `text-features.png` draws only text
# and stays. A new golden drawing fixture media belongs on this list and in LICENSE-MEDIA.md.
exclude = [
    "tests/golden/fixture-intro.png",
    "tests/golden/fixture-sentence.png",
    "tests/golden/paint-vocabulary.png",
    "tests/golden/mask-under-transform.png",
    "tests/golden/mask-explicit-rect.png",
]

[dependencies]
montagent-render.workspace = true
montagent-text.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true

[dev-dependencies]
# The independent oracle for `tests/measure.rs`. `measure`'s ascent and descent reach it
# through `parley`'s shaping; the test reads the same font's vertical metrics straight off
# the file through `skrifa`, so the expected value comes from somewhere other than the code
# under test rather than being recomputed the way that code computes it.
skrifa.workspace = true
# The independent decoder for `tests/frame.rs`. A claim about pixels is the one class of
# claim no report can reach, and an encoder agreeing with its own decoder proves they agree
# rather than that the bytes are a picture — so the test reads them back with something
# other than the Skia codec that wrote them.
image.workspace = true
