[package]
name = "montaget-core"
description = "The Montaget core library: parsing, the finding type, the check registry and the report surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
montaget-text.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# The independent oracle for `tests/measure.rs`. `measure`'s ascent and descent reach it
# through `parley`'s shaping; the test reads the same font's vertical metrics straight off
# the file through `skrifa`, so the expected value comes from somewhere other than the code
# under test rather than being recomputed the way that code computes it.
skrifa.workspace = true
