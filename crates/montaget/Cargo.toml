[package]
name = "montaget"
description = "A video editor whose project format is authored by an AI agent: one binary, a CLI and an MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
montaget-core.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.4", features = ["server", "macros", "schemars", "transport-io"] }
schemars.workspace = true
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
serde_json.workspace = true
