# PROTOTYPE (#659): builds the throwaway remote-MCP image. Lives only on its branch.
name: prototype remote mcp image

on:
  push:
    branches: [prototype/remote-mcp]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - run: cargo build --release -p montagent
      - run: mkdir ctx && cp target/release/montagent Dockerfile.prototype ctx/ && strip ctx/montagent
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: ctx/Dockerfile.prototype
          push: true
          tags: |
            ghcr.io/mbehtemam/montagent-remote-proto:latest
            ghcr.io/mbehtemam/montagent-remote-proto:${{ github.sha }}
