# Cuts a GitHub Release for a `v*` tag: one `montagent` binary per shipped desktop target
# (ADR-0064's six), the two macOS ones signed and notarized before anything is published
# (ADR-0139), a `SHA256SUMS` file over all of them, and — when a crates.io token is
# configured — `cargo publish` of the four workspace crates in dependency order.
#
# A tag with a pre-release suffix (`v0.2.0-rc1`, any `-`) is published as a **draft**
# and never reaches crates.io, so the whole pipeline can be exercised without a public
# release or an irreversible publish.
#
# Native runners only, the same six targets and runners as `ci.yml` covers — five suite
# legs and one build-only leg for `x86_64-apple-darwin` (ADR-0188), which is still
# shipped here although its tests no longer run — and for the same reason: a
# cross-compiled job resolves `skia-safe`'s prebuilt for the target but cannot run
# anything on it, and this workflow's whole job is producing a binary someone else runs.
#
# Deliberately absent: any step that checks for a newer release, calls home, or updates
# anything after the fact. ADR-0064's update policy is "whatever channel was used is the
# entire update story" — this workflow is that channel's producing side, once, per tag.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v0.1.0"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ADR-0064's six, all still shipped (ADR-0188 stopped *testing* Intel macOS,
          # not building it). Kept in lockstep with `ci.yml`'s two matrices and the
          # canary's by hand — `skia_pin.rs` checks all of them against
          # `[workspace.metadata.skia] targets` in the root `Cargo.toml`, but a workflow
          # matrix cannot be generated from that file without a separate job to read it
          # first, which is more moving parts than six lines justify.
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Skia's Linux link line ends in `-lstdc++ -lfreetype -lfontconfig` (see
      # `ci.yml`'s matching comment) — system libraries the prebuilt links against, not
      # FFmpeg, and not bundled into the archive below.
      - name: Install Skia's Linux link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

      # Only the shipping binary — not the workspace's test-only crates (the golden-frame
      # harness in `docs/research/prototypes/rust-rasterizer` needs nothing released).
      - name: Build montagent
        run: cargo build --release --locked --target ${{ matrix.target }} -p montagent

      # The prebuilt Skia the build just linked carries five vendored C/C++ libraries whose
      # notices `cargo about` cannot see, so the archive's `THIRD-PARTY.md` is only honest if
      # what it names is what this leg actually linked. Checked here, per target, against the
      # prebuilt now sitting in `target/` — the same script `ci.yml` runs.
      - name: THIRD-PARTY.md still describes what this binary links (#359)
        run: python3 ci/assert_third_party_attribution.py --prebuilt-only

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          name="montagent-${version}-${{ matrix.target }}"
          stage="$(mktemp -d)/${name}"
          mkdir -p "$stage"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/montagent.exe" "$stage/"
          else
            cp "target/${{ matrix.target }}/release/montagent" "$stage/"
          fi
          # The archive used to be the binary and nothing else (#362 measured it: two entries,
          # one of them the directory), which meant the distributed artifact carried no licence
          # text at all — neither Montagent's own nor the notices owed for the Skia prebuilt's
          # vendored libraries nor those of the Rust crates linked into it (#359).
          #
          # `LICENSE-MEDIA.md` deliberately does not ride along. It is the canonical list of the
          # rights-reserved fixture media, and not one of those paths is in this archive; adding
          # it would put ninety filenames in front of a reader whose tarball contains none of
          # them. The pointer at the foot of `LICENSE` names it, and the repository is where it
          # lives.
          cp LICENSE THIRD-PARTY.md "$stage/"
          # #369/#379: a stranger's whole path to a first rendered frame, without an MCP
          # client — `fonts vendor` then `render`, both against the copy in the archive.
          cp -r examples "$stage/"
          pushd "$(dirname "$stage")" >/dev/null
          if [ "${{ matrix.archive }}" = "zip" ]; then
            archive="${name}.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            archive="${name}.tar.gz"
            tar czf "$archive" "$name"
          fi
          popd >/dev/null
          mv "$(dirname "$stage")/${archive}" .
          echo "path=${archive}" >> "$GITHUB_OUTPUT"

      # macOS archives go to `sign-macos` first; only `dist-*` artifacts are published,
      # so an unsigned macOS build can never reach the release.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os == 'macOS' && 'unsigned' || 'dist' }}-${{ matrix.target }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  # ADR-0139: the same procedure as the dev's local fallback (ADR-0138), run by
  # `ci/sign_macos_release.py --archives`. The Developer ID identity (a `.p12`) and the
  # App Store Connect API key live only in the `release` environment, which only `v*`
  # tags and `main` can use. The identity goes into a throwaway keychain that is deleted
  # at the end, whatever happened.
  sign-macos:
    name: sign and notarize the macOS archives
    needs: build
    runs-on: macos-15
    environment: release
    # A team's first notarization took about two hours (#586); later ones take a minute.
    timeout-minutes: 240
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The script from the commit this run is for: on a tag push that is the tag; on
      # `workflow_dispatch` it is `main`, so an old tag is re-signed with today's script.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: unsigned
          merge-multiple: true

      - name: Are the signing credentials configured?
        id: gate
        env:
          CONFIGURED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_P12_PASSWORD != '' && secrets.NOTARY_API_KEY_P8_BASE64 != '' && vars.NOTARY_API_KEY_ID != '' && vars.NOTARY_API_ISSUER != '' }}
        run: |
          if [ "$CONFIGURED" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = MBehtemam/Montagent ]; then
            echo "::error::the release environment is missing a signing secret or variable (ADR-0139); refusing to publish unsigned macOS builds"
            exit 1
          else
            echo "::warning::no signing credentials in this fork; its macOS archives are published unsigned"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the Developer ID identity into a throwaway keychain
        if: steps.gate.outputs.configured == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          printf '%s' "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/identity.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$RUNNER_TEMP/signing.keychain-db" > /dev/null
          rm "$RUNNER_TEMP/identity.p12"
          # Put it first in the search list, so `find-identity` and `codesign` see it.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" $existing

      - name: Sign and notarize
        if: steps.gate.outputs.configured == 'true'
        env:
          KEY_ID: ${{ vars.NOTARY_API_KEY_ID }}
          ISSUER: ${{ vars.NOTARY_API_ISSUER }}
        run: >-
          python3 ci/sign_macos_release.py "$TAG" --archives unsigned --out dist
          --api-key "$RUNNER_TEMP/notary.p8" --api-key-id "$KEY_ID" --api-issuer "$ISSUER"
          --poll-seconds 30

      - name: Pass the archives through unsigned (forks without credentials only)
        if: steps.gate.outputs.configured != 'true'
        run: mkdir -p dist && cp unsigned/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-aarch64-apple-darwin
          path: dist/*-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64-apple-darwin
          path: dist/*-x86_64-apple-darwin.tar.gz
          if-no-files-found: error

      - name: Delete the keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/identity.p12"

  release:
    name: publish the GitHub Release
    needs: [build, sign-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # No auto-generated "what's changed" prose: the tag is the release, and its
          # message (from an annotated tag) is the changelog, not a GitHub-guessed diff.
          files: |
            dist/*
          fail_on_unmatched_files: true
          draft: ${{ contains(inputs.tag || github.ref_name, '-') }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

  # `cargo publish --workspace` of the four workspace crates (#361, #366). Skipped
  # entirely — not failed — when no token is configured, so a fork or an early tag can
  # still cut a GitHub Release without crates.io in the loop.
  #
  # This used to publish crate-by-crate in dependency order with a `sleep 30` between
  # each, betting on crates.io index propagation. That bet cannot be won on a first
  # publish: `cargo publish -p montagent-core` fails outright with "no matching package
  # named `montagent-render` found" because the dependency does not exist in the
  # registry yet, and no amount of sleeping creates it (#361 reproduced this with
  # `--dry-run`). The dependency order itself was always correct — the order was never
  # the bug.
  #
  # `--workspace` resolves this by standing up a temporary local registry and publishing
  # each crate into it before the next one's registry dependency is resolved, which
  # removes both the ordering burden and the propagation race. Dry-runs clean for all
  # four (#361, #366); `--workspace` is confirmed present on the pinned 1.90 toolchain
  # (`cargo +1.90 publish --help` lists it), so the pin does not need to move.
  #
  # What this does **not** fix: `--workspace` is not atomic. A mid-run server error
  # leaves the workspace partially published, and a published version can only be
  # yanked, never replaced. Strictly better than the loop — it cannot fail on
  # ordering — but the first publish is still not risk-free.
  # After the release, not beside it: a version on crates.io can never be replaced, so it
  # waits until every archive is built, signed and published. The token lives in the
  # `release` environment with the signing secrets. Pre-release tags never publish.
  publish-crates:
    name: cargo publish
    needs: release
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Has a crates.io token been configured?
        id: gate
        run: echo "configured=${{ secrets.CARGO_REGISTRY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.configured == 'true'
        with:
          toolchain: "1.90"

      - name: Skia's Linux link dependencies (montagent-render needs to build to publish)
        if: steps.gate.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

      - name: Publish the workspace
        if: steps.gate.outputs.configured == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
