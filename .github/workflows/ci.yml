# The suite, on all six desktop tier-1 targets (ADR-0064, #189).
#
# This is the per-PR job. It is deliberately *not* the Skia prebuilt canary:
# this one caches, and a cached job structurally cannot see the failure #36 is
# about, which arrives from upstream rather than from a commit. The canary is
# `skia-canary.yml` and runs cold, on a schedule.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # So the matrix can be dry-run from a branch before it is required. The
  # oracle's golden tolerance was calibrated on one architecture (see
  # `tests/oracle.rs`) and the first run on the other five is also the first
  # measurement of them.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  suite:
    # This name is the branch-protection contract: `<target>`, one per leg of
    # ADR-0064's six, plus `committed checks`. `check_names_do_not_collide` in
    # `skia_pin.rs` keeps it distinct from the canary's.
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ADR-0064 commits to {aarch64, x86_64} x {apple-darwin,
          # unknown-linux-gnu, pc-windows-msvc}. Every entry is a *native*
          # runner: a cross-compiled job would resolve the prebuilt for the
          # target but could not run the oracle, and the oracle is the half of
          # this suite that looks at pixels.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # `rust-version` in the workspace manifest. Stated here too because a
          # runner's "stable" drifts and the MSRV claim should be checked, not
          # assumed.
          toolchain: "1.90"
          targets: ${{ matrix.target }}
          # An explicit toolchain makes the action install `--profile minimal`,
          # which is rustc and cargo and nothing else. Without this the Clippy
          # step below fails with "no such command: clippy" on every leg.
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Montagent spawns an `ffmpeg` the user supplies rather than bundling one
      # (ADR-0009: `libx264` is GPL and linking `libavcodec` would make the
      # shipped binary a GPL combined work), so CI supplies one the same way a
      # user would.
      # Skia's own Linux link line ends in `-lstdc++ -lfreetype -lfontconfig`
      # (`skia-bindings`' `platform/linux.rs`), so the prebuilt resolves fine and
      # then nothing that links it will build without these. The canary does not
      # catch it: it builds an rlib and never links, which is why it is green on
      # Linux while the suite was not.
      #
      # `embed-freetype` would remove the freetype half — and it is one of the
      # features `skia-bindings` keys its prebuilt on, so turning it on moves
      # Montagent off `jpegd-jpege-pdf`. That is its own ticket that re-verifies
      # all six targets (#189), not a thing to do while chasing a red build.
      - name: Install Skia's Linux link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

      # ADR-0115: the Linux legs test the *floor* — ffmpeg 7.1 with libx264, a pinned
      # static build verified by checksum — because apt's 6.1 is below it. macOS and
      # Windows below install the newest release, so the next ffmpeg that removes an
      # option Montagent uses turns CI red without anyone bumping a pin.
      - name: Install ffmpeg at the floor (Linux)
        if: runner.os == 'Linux'
        run: |
          ci/install_ffmpeg_floor.sh "$RUNNER_TEMP/ffmpeg-floor"
          echo "$RUNNER_TEMP/ffmpeg-floor/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: ffmpeg is on PATH
        run: ffmpeg -version

      # The skills drift guard (`tests/skills.rs`, #513) runs every skill script on the
      # minimum Python its header states, and `uv` is how it gets exactly that Python. The
      # test refuses to fall back to whatever `python3` the runner has when `CI` is set.
      - uses: astral-sh/setup-uv@v6

      - name: Clippy
        # `-D warnings` after the `--` so it applies to the workspace rather than
        # to every dependency: a warning in somebody else's crate is not a
        # reason this repository cannot build.
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      # `--release` because the oracle rasterizes two full 1080x1920 frames per
      # arm and a debug build of Skia's callers makes that minutes rather than
      # seconds.
      #
      # `--no-fail-fast` because `cargo test` otherwise stops at the first test
      # *binary* that fails, and on a target nobody has run before that turns a
      # matrix into a serial search: the first Windows run reported 8 of 24
      # binaries and stopped, so each fix bought exactly one more failure, a
      # quarter of an hour apart. A red leg should say everything it knows in one
      # go.
      - name: Test suite
        run: >
          cargo test --workspace --all-targets --release
          --target ${{ matrix.target }} --no-fail-fast

      # `cargo test` captures a passing test's output, so the oracle's deltas —
      # the numbers `tests/oracle.rs` says it "prints on every run" — were
      # invisible on a green leg, which is exactly the leg whose measurement is
      # worth having. The golden tolerance was calibrated on one architecture; if
      # a target ever exceeds it, the fix is to widen to *that target's measured
      # number*, and this is where that number comes from. Re-running costs a
      # second: the build is warm and it rasterizes six 1080x1920 frames.
      - name: The oracle's measured deltas, for the record
        run: cargo test -p rast-bench --release --target ${{ matrix.target }} -- --nocapture

      # `--all-targets` skips doctests, which is where several of the ADR
      # citations in `montagent-core` live.
      - name: Doctests
        run: cargo test --workspace --doc --release --target ${{ matrix.target }}

      # The ducking script (ADR-0177, #838). The two steps run on every leg that already
      # runs the other skill scripts: the first reads the bed's `volume` back through this
      # leg's own `montagent` at the instants the words file names (`CI` makes a missing
      # `montagent` or `ffmpeg` a failure, not a skip), the second re-derives the level
      # arithmetic the script's defaults rest on.
      - name: The ducking script writes the keyframes it says it does, and refuses, replaces and checks as documented
        env:
          MONTAGENT: target/${{ matrix.target }}/release/montagent
        run: python3 -m unittest ci/test_duck.py

      - name: The ducking levels' arithmetic still holds
        run: python3 -I docs/research/audio-effects/ducking/check_duck_levels.py

      # What the Skia prebuilt vendors, read out of the archive this leg just downloaded
      # (#359). It lives in the matrix rather than in `committed checks` for the same reason
      # the Ken Burns check does — it needs something the build produced — but unlike that
      # one it runs on *every* leg, because the answer is a fact about the target: the six
      # archives differ in their font-manager ports, and a future one could differ in what
      # it vendors. `committed checks` runs the other half, which needs no Skia at all.
      - name: THIRD-PARTY.md still describes what the prebuilt vendors (#359)
        run: python3 ci/assert_third_party_attribution.py --prebuilt-only

      # The other half of `ci/reference_frame_instants.py` — the Ken Burns pivot
      # #276 corrected, re-derived by searching scale and offset against a
      # render of the fixture and checked against whatever pivot the project
      # file declares, so reverting the fixture fails here. It lives here
      # rather than in `committed
      # checks` because it needs a built `montagent` and that job deliberately
      # has no Skia in it; it is pinned to one leg because the answer is a fact
      # about the published video, not about the target, and running it six
      # times would be six copies of one measurement.
      #
      # `--binary` rather than letting the script `cargo run`: this leg has just
      # built the workspace for `--target`, and a bare `cargo run` would ignore
      # that and produce a second, host, debug build of everything.
      - name: The published Ken Burns still pivots where the fixture says it does (#276)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 ci/reference_frame_instants.py \
            --binary target/${{ matrix.target }}/release/montagent

      # The publish path itself, run cold on every push (#361, #366). `release.yml`'s
      # `publish-crates` job had never run before #361 found it broken on a first
      # publish — `cargo publish -p montagent-core` fails outright because
      # `montagent-render` is not yet in the crates.io index, and no `sleep` fixes
      # that. This is the check that would have caught it, and it now runs on every
      # push instead of on the day of the first tag. Pinned to one leg: the answer is
      # a fact about the manifests and the dependency graph, not about the target,
      # and six copies of it would be six copies of one measurement — same reasoning
      # as the Ken Burns check above.
      #
      # `--dry-run` only: nothing here ever uploads. `--allow-dirty` is not passed —
      # a real CI checkout has nothing uncommitted, and if it ever did, that is
      # exactly the case this check should refuse rather than paper over.
      - name: cargo publish --workspace still dry-runs clean (#361, #366)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo publish --workspace --dry-run --locked

  checks:
    # Formatting and the committed re-executable checks `docs/agents/domain.md`
    # requires. All of it is platform-independent, so one runner is enough —
    # `clippy` stays in the matrix above because it is not: a lint can fire on
    # `cfg`-gated code that only one target compiles.
    name: committed checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt

      - name: Formatting
        run: cargo fmt --all --check

      - name: ADR headers, banners and index agree
        run: python3 docs/adr/check_amendment_banners.py

      - name: ADR-0070's two claims about the schema still hold
        run: python3 docs/adr/predicate_reserved_names_scan.py

      - name: ADR-0071's caption numbers still come off the fixture
        run: python3 docs/adr/caption_check_scan.py

      - name: ADR-0074's presence-set numbers still come off the fixture
        run: python3 docs/adr/cut_presence_scan.py

      - name: The prebuilt canary's assertion still tells good logs from bad
        run: python3 ci/assert_prebuilt_key.py --self-test

      # The offline half of the skills workaround guard (#513): the lint's own examples,
      # then the lint over `skills/`. The closed-issue half is `skills.yml`, which needs the
      # tracker and runs only on PRs touching `skills/`.
      - name: The skills workaround lint still tells marked from unmarked
        run: python3 ci/skills_workarounds.py --self-test

      - name: Every Workaround in skills/ carries a well-formed marker
        run: python3 ci/skills_workarounds.py --lint

      - name: The pre-render skill's SVG route still rebuilds, and still fails on a missing font
        run: python3 -m unittest ci/test_prerender_still.py

      - name: The pre-render skill's Lottie route still rebuilds, refuses what a player skips, and draws one fresh player per frame
        run: |
          python3 -m pip install thorvg-python==1.1.3
          python3 -m unittest ci/test_prerender_lottie.py

      - name: ADR-0064's packaging invariants still hold (no tap, no phone-home, no linked FFmpeg)
        run: python3 ci/assert_passive_packaging.py

      # The licence gate (#359). `assert_passive_packaging.py` above names the specific crates
      # that must never enter the graph; this asks the complementary question — whether
      # anything in it carries a licence nobody has accepted. `deny.toml` is an allowlist, so a
      # copyleft dependency fails whether or not somebody thought to name it, which is what
      # ADR-0009's "never a GPL combined work" needs in order to be an invariant rather than a
      # thing people remember.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about

      - name: No dependency carries a licence this binary cannot ship
        run: cargo deny check

      # The other half of the #359 check: `THIRD-PARTY.md` is generated from the dependency
      # graph, so regenerating it and diffing is what makes a new dependency fail a build
      # rather than ship unattributed. `--skip-prebuilt` because this job deliberately has no
      # Skia in it; the matrix legs above run the prebuilt half.
      - name: THIRD-PARTY.md still matches the dependency graph
        run: python3 ci/assert_third_party_attribution.py --skip-prebuilt

      # Every published crate's tarball ships the licence text `license = "MIT"` claims
      # (#361, #366). `license.workspace = true` satisfies crates.io's own requirement; this
      # is the separate question of whether the text sits behind it, which #361 found it did
      # not — the four tarballs shipped no `LICENSE` at all. Toolchain-light, same reason as
      # the other checks in this job: it is a byte comparison against the root file, nothing
      # to build.
      - name: Every crate ships the licence text it claims (#361, #366)
        run: python3 ci/assert_crate_licenses.py

      # Which frame of the published MP4 each committed reference PNG is —
      # numbers `tests/reference_frames.rs` and the fixture README both state,
      # so `docs/agents/domain.md` wants them re-derivable rather than
      # transcribed. A claim about which frame of a video a picture is rots the
      # moment anybody re-encodes the fixture.
      #
      # `--instants-only` because this job is deliberately toolchain-light —
      # rustfmt and python, no Skia — and the script's other half renders
      # through the built binary. That half runs in the matrix leg that has
      # already built one; see "the Ken Burns pivot" there.
      - name: ffmpeg and Pillow, for the reference-frame check
        run: |
          ci/install_ffmpeg_floor.sh "$RUNNER_TEMP/ffmpeg-floor"
          echo "$RUNNER_TEMP/ffmpeg-floor/bin" >> "$GITHUB_PATH"
          python3 -m pip install --break-system-packages pillow

      - name: The reference frames are still the frames the suite says they are
        run: python3 ci/reference_frame_instants.py --instants-only
