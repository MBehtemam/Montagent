[workspace]
resolver = "3"
members = [
    "crates/montaget-core",
    "crates/montaget-text",
    "crates/montaget-render",
    "crates/montaget",
    # ADR-0010 requires the two-arm harness to stay in-tree as the correctness
    # oracle and golden-frame guard, and #168 names its path. It is a member so
    # that `skia-safe` is pinned in exactly one place (#189) and so `cargo test
    # --workspace` actually runs the oracle rather than leaving it a directory
    # nobody builds.
    "docs/research/prototypes/rust-rasterizer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/MBehtemam/Montaget"

[workspace.dependencies]
montaget-core = { path = "crates/montaget-core", version = "0.1.0" }
montaget-text = { path = "crates/montaget-text", version = "0.1.0" }
montaget-render = { path = "crates/montaget-render", version = "0.1.0" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# ADR-0034's pace metric is counted over **grapheme clusters** — "not UTF-16 code
# units — combining marks and emoji must not double-count" — and its repeat check
# groups on text that is byte-identical **after NFC normalization**. Neither is a
# table Montaget can carry itself: both are derived from the Unicode character
# database, which is versioned and revised, and a hand-rolled approximation of
# either would be a threshold with no provenance (ADR-0061) wearing the costume of
# an implementation detail.
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.23"

# --- The Skia pin. This is the one place (#189, #36). ---------------------
#
# ADR-0010 accepted a C++ dependency on the strength of one premise: the
# required prebuilt is published for every target, so nobody compiles Skia from
# source. `skia-safe` keys its prebuilt download on the *exact sorted feature
# set*, so the feature list below is not a preference — it is the key.
#
# `default-features = false` plus the explicit list is deliberate: it means an
# upstream change to `skia-safe`'s defaults cannot move Montaget's key without
# a diff here. Changing this list is its own ticket that re-verifies all six
# targets (#189); `svg` and `skottie` both imply `textlayout` and would move it.
#
# `crates/montaget-render/tests/skia_pin.rs` derives the resolved key from this
# list and checks it against `workspace.metadata.skia.prebuilt-key` below, so
# the key is computed from the pin rather than stated a second time.
skia-safe = { version = "=0.153.2", default-features = false, features = [
    "binary-cache",
    "embed-icudtl",
    "pdf",
    "jpeg",
] }

# The named exit if the prebuilt story breaks (ADR-0010), and the second arm of
# the golden-frame oracle. Never a parallel backend.
tiny-skia = "=0.12.0"

# The text stack that stands beside the rasterizer (ADR-0010): parley shapes and
# breaks, skrifa scales the outlines, the rasterizer fills the paths.
#
# **Without `system`, deliberately.** That feature is `fontique`'s system-font
# discovery, and dropping it makes ADR-0010's "the renderer opens nothing outside
# the chain" — and spec #168's story 53, *"a project that renders on my machine
# renders on a clean one"* — structural rather than a discipline: a system family
# name cannot resolve because the code that would resolve it is not compiled in.
# It also takes `yeslogic-fontconfig-sys` with it, so a Linux build needs no
# `libfontconfig` and the six targets stop differing in what they link.
parley = { version = "=0.11.1", default-features = false, features = ["std"] }
skrifa = "=0.46.2"

# ADR-0008's break opportunities. **The same shared node `parley` already links** — the
# ADR names `icu_segmenter` v2.3.0 as *"the same shared node parley links"* and says it
# *"can be called directly by `measure` whichever crate renders"*, because the `SA`
# dictionary fork is an authoring-tool requirement rather than a renderer one. Direct,
# rather than read back out of a `parley` layout, because the ADR asks for the offsets
# **and the segmenter's data version** alongside them, and a layout reports neither.
#
# `default-features = false` plus `compiled_data` is `parley`'s own feature set for this
# dependency, so declaring it here adds no data to the binary that was not already in it.
icu_segmenter = { version = "=2.3.0", default-features = false, features = [
    "compiled_data",
] }
image = "=0.25.10"
toml = "0.9"

[workspace.metadata.skia]
# The key the feature set above must resolve to — CPU-only, no `ganesh`, no
# `gl` (ADR-0010). Derived from the pin and asserted by `skia_pin.rs`; read by
# `ci/assert_prebuilt_key.py`, which is what the scheduled canary asserts
# against a cold build's log (#36).
prebuilt-key = "jpegd-jpege-pdf"

# The six desktop tier-1 targets ADR-0064 commits to. The suite runs on all of
# them; the canary resolves the prebuilt on all of them.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]
